# Fly-bian KIAUH stub — replace serial and kinematics for your printer.
# KIAUH / Mainsail-Config / extensions expect this file to exist.

[mcu]
serial: /dev/serial/by-id/<your-mcu-id>

[virtual_sdcard]
path: ~/printer_data/gcodes
on_error_gcode: CANCEL_PRINT

[printer]
kinematics: none
max_velocity: 1000
max_accel: 1000
