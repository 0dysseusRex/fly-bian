#
# Fly-bian GrumpyScreen override (printer_data/config/grumpyscreen.ini).
# Simple-AF install copies pellcorp's template over this file — bake keeps
# display_rotate here so the choice survives. Change with:
#   fly-grumpy-rotate 0|1|2|3
#   (also fly-start menu 5/6, or GRUMPY_DISPLAY_ROTATE in fly-start.txt)
#
[ui]
# 0 = 0°, 1 = 90°, 2 = 180°, 3 = 270° — set per panel mount
display_rotate: 0
