# Official FLY-USB-LIS2DW pins (RP2040 on the dongle, not the Lite).
# Lite 2.1 has no host SPI/I2C ADXL. Plug this into a USB-A port.
# Source: https://mellow.klipper.cn/en/docs/ProductDoc/ToolBoard/fly-usb-adxl/fly-usb-lis2dw/cfg
#
# Replace the serial path:
#   ls -l /dev/serial/by-id/

[mcu LIS]
serial: /dev/serial/by-id/usb-Klipper_rp2040_XXXXXXXXXXXXXXXXXXXXX

[lis2dw]
cs_pin: LIS:gpio9
spi_software_sclk_pin: LIS:gpio10
spi_software_mosi_pin: LIS:gpio11
spi_software_miso_pin: LIS:gpio12

[resonance_tester]
accel_chip: lis2dw
probe_points: 150, 150, 20
min_freq: 5
max_freq: 133
accel_per_hz: 75
hz_per_sec: 1
