# Official Fly Lite 2.1 power-loss resume.
# Source: https://mellow.klipper.cn/en/docs/ProductDoc/SBC/fly-lite/lite2.1/advanced/kppm/
#
# Before using this file:
#   1. Comment out shutdown_pin and shutdown_pin_state in sys-config.conf
#   2. Add [include plr.cfg] at the top of printer.cfg
#   3. Keep power_pin on the host. Never use a printer-MCU pin.

[mcu host]
serial: /tmp/klipper_host_mcu

[power_loss_resume]
power_pin: host:gpiochip1/gpio8
is_shutdown: True
paused_recover_z: -2.0
start_gcode:
    # M118 {PLR}
    M118 Starting resume: {PLR.print_stats.filename}
    M118 Interrupt position: X:[{PLR.POS_X}] Y:[{PLR.POS_Y}] Z:[{PLR.POS_Z}] E:[{PLR.POS_E}]
    {% for name, heater in PLR.heaters.items() %}
        {% if heater.target > 0 %}
            M118 Set heater[{heater.name}] target temperature: {heater.target}
            SET_HEATER_TEMPERATURE HEATER="{heater.name}" TARGET={heater.target}
        {% endif %}
    {% endfor %}
    {% if PLR.toolhead.extruder in PLR.heaters and PLR.heaters[PLR.toolhead.extruder].target > 0 %}
        {% set extruder = PLR.heaters[PLR.toolhead.extruder] %}
        M118 Waiting for [{extruder.name}] to reach target temperature: {extruder.target}
        TEMPERATURE_WAIT SENSOR="{extruder.name}" MINIMUM={extruder.target-5} MAXIMUM={extruder.target+5}
    {% endif %}
    M83
    G1 E-2 F1000
    G91
    G1 Z2 F100
    G90
    G28 X Y
resume_gcode:
    M83
    G1 E4 F800
layer_count: 2
layer_change_gcode:
    M118 Restore printing speed
    M106 S{PLR.fan_speed}
    M220 S{PLR.move_speed_percent}
    M221 S{PLR.extrude_speed_percent}
shutdown_gcode:
    M118 Power supply voltage low, shutting down
    # M112
