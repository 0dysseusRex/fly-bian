# Official Lite 2.1 homing override for power-loss resume.
# Only include this if you already need [homing_override].
# Do not set an arbitrary homing pose or PLR will fail.
# Source: https://mellow.klipper.cn/en/docs/ProductDoc/SBC/fly-lite/lite2.1/advanced/kppm/

[force_move]
enable_force_move: true

[homing_override]
axes: z
gcode:
    {% set max_x = printer.configfile.config["stepper_x"]["position_max"]|float %}
    {% set max_y = printer.configfile.config["stepper_y"]["position_max"]|float %}
    {% if 'z' not in printer.toolhead.homed_axes %}
        SET_KINEMATIC_POSITION Z=0
        G90
        G0 Z5 F600
    {% endif %}
    {% set home_all = 'X' not in params and 'Y' not in params and 'Z' not in params %}
    {% if home_all or 'X' in params %}
    G28 X
    {% endif %}
    {% if home_all or 'Y' in params %}
    G28 Y
    {% endif %}
    {% if home_all or 'Z' in params %}
    G0 X{max_x / 2} Y{max_y / 2} F3600
    G28 Z
    G1 Z10 F2000
    {% endif %}
